# felitronics-eqview CI — the whole library is JUCE-free, so every platform runs the whole suite.
# Nothing is checked out beside this repo, which means core arrives by its PIN: a green run here
# proves the pinned version builds, not the sibling checkout a developer happens to have.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.os }}${{ matrix.juce == 'ON' && ' + JUCE gate' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            juce: "OFF"
          - os: windows-latest
            juce: "OFF"
          - os: macos-latest
            juce: "ON"      # one platform compiles the drawing layer against a real JUCE
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_EQVIEW_TESTS_WITH_JUCE=${{ matrix.juce }}
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
